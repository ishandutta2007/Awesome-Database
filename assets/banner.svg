<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0B0F19"/><stop offset="50%" stop-color="#1E1B4B"/><stop offset="100%" stop-color="#0F172A"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366F1"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#EC4899"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseRing{0%{transform:scale(.95);opacity:.3}50%{transform:scale(1.08);opacity:.8}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.4}50%{transform:translateY(-15px) translateX(10px);opacity:.9}}@keyframes lineFlow{0%{stroke-dashoffset:200}}.bg-grid{fill:url(#grid)}.pulse-glow-1{animation:pulseRing 6s infinite ease-in-out;transform-origin:950px 200px}.pulse-glow-2{animation:pulseRing 8s infinite ease-in-out 1s;transform-origin:200px 100px}.particle-1{animation:floatParticle 5s infinite ease-in-out}.particle-2{animation:floatParticle 7s infinite ease-in-out 2s}.particle-3{animation:floatParticle 6s infinite ease-in-out 1s}.db-ring{animation:rotateDbRing 25s linear infinite;transform-origin:950px 200px}.flowing-line{stroke-dasharray:20,10;animation:lineFlow 10s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGradient)"/><rect width="1200" height="400" class="bg-grid"/><g id="background-dynamic-graphics"><circle cx="950" cy="200" r="160" fill="#8B5CF6" class="pulse-glow-1" filter="blur(40px)" opacity=".15"/><circle cx="200" cy="100" r="120" fill="#06B6D4" class="pulse-glow-2" filter="blur(30px)" opacity=".12"/><g class="db-ring" opacity=".25"><circle cx="950" cy="200" r="130" fill="none" stroke="url(#primaryGlow)" stroke-dasharray="15 10" stroke-width="2"/><circle cx="950" cy="200" r="100" fill="none" stroke="url(#cyanGlow)" stroke-dasharray="10 8" stroke-width="1.5"/></g><path fill="none" stroke="url(#primaryGlow)" stroke-width="2" d="M 50 320 Q 300 380 600 320 T 1150 350" class="flowing-line" opacity=".3"/><path fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" d="M 0 80 Q 400 20 800 90 T 1200 40" class="flowing-line" opacity=".25"/><g class="particle-1"><rect width="90" height="28" x="900" y="80" fill="rgba(99, 102, 241, 0.2)" stroke="#8B5CF6" stroke-width="1" rx="14"/><text x="945" y="98" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Postgres</text></g><g class="particle-2"><rect width="110" height="28" x="1030" y="240" fill="rgba(6, 182, 212, 0.2)" stroke="#06B6D4" stroke-width="1" rx="14"/><text x="1085" y="258" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Distributed SQL</text></g><g class="particle-3"><rect width="100" height="28" x="830" y="280" fill="rgba(236, 72, 153, 0.2)" stroke="#EC4899" stroke-width="1" rx="14"/><text x="880" y="298" fill="#F472B6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Serverless DB</text></g><g class="particle-1"><rect width="80" height="28" x="980" y="140" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1" rx="14"/><text x="1020" y="158" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BaaS</text></g></g><g id="foreground-content"><rect width="740" height="280" x="60" y="60" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" rx="20"/><rect width="230" height="32" x="95" y="95" fill="url(#primaryGlow)" rx="16"/><text x="210" y="116" fill="#FFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">🚀 CURATED ECOSYSTEM</text><text x="95" y="180" fill="#FFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5">Awesome Database</text><text x="95" y="225" fill="url(#cyanGlow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700">Cloud-Native &amp; Open-Source</text><text x="95" y="268" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Distributed SQL • Serverless Postgres • Managed DBaaS • BaaS Platforms</text><rect width="670" height="4" x="95" y="298" fill="url(#primaryGlow)" rx="2"/></g></svg>