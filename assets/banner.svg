<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspect */
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }

    @keyframes rotateDbRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes lineFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .bg-grid { fill: url(#grid); }
    .pulse-glow-1 { animation: pulseRing 6s infinite ease-in-out; transform-origin: 950px 200px; }
    .pulse-glow-2 { animation: pulseRing 8s infinite ease-in-out 1s; transform-origin: 200px 100px; }
    .particle-1 { animation: floatParticle 5s infinite ease-in-out; }
    .particle-2 { animation: floatParticle 7s infinite ease-in-out 2s; }
    .particle-3 { animation: floatParticle 6s infinite ease-in-out 1s; }
    .db-ring { animation: rotateDbRing 25s linear infinite; transform-origin: 950px 200px; }
    .flowing-line { stroke-dasharray: 20, 10; animation: lineFlow 10s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  <rect width="1200" height="400" class="bg-grid"/>

  <!-- DYNAMIC ANIMATED BACKGROUND ELEMENTS -->
  <g id="background-dynamic-graphics">
    <!-- Glowing Orbs -->
    <circle cx="950" cy="200" r="160" fill="#8B5CF6" opacity="0.15" class="pulse-glow-1" filter="blur(40px)"/>
    <circle cx="200" cy="100" r="120" fill="#06B6D4" opacity="0.12" class="pulse-glow-2" filter="blur(30px)"/>

    <!-- Decorative Database Dynamic Rings on Right Side -->
    <g class="db-ring" opacity="0.25">
      <circle cx="950" cy="200" r="130" fill="none" stroke="url(#primaryGlow)" stroke-width="2" stroke-dasharray="15 10"/>
      <circle cx="950" cy="200" r="100" fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" stroke-dasharray="10 8"/>
    </g>

    <!-- Animated Data Flow Lines (Background) -->
    <path class="flowing-line" d="M 50 320 Q 300 380 600 320 T 1150 350" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.3"/>
    <path class="flowing-line" d="M 0 80 Q 400 20 800 90 T 1200 40" fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" opacity="0.25"/>

    <!-- Floating Data Nodes / Pills (Background Layer) -->
    <g class="particle-1">
      <rect x="900" y="80" width="90" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="#8B5CF6" stroke-width="1"/>
      <text x="945" y="98" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Postgres</text>
    </g>

    <g class="particle-2">
      <rect x="1030" y="240" width="110" height="28" rx="14" fill="rgba(6, 182, 212, 0.2)" stroke="#06B6D4" stroke-width="1"/>
      <text x="1085" y="258" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Distributed SQL</text>
    </g>

    <g class="particle-3">
      <rect x="830" y="280" width="100" height="28" rx="14" fill="rgba(236, 72, 153, 0.2)" stroke="#EC4899" stroke-width="1"/>
      <text x="880" y="298" fill="#F472B6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Serverless DB</text>
    </g>

    <g class="particle-1">
      <rect x="980" y="140" width="80" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
      <text x="1020" y="158" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BaaS</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Clean backdrop panel & Crisp Text to ensure foreground clarity -->
  <g id="foreground-content">
    <!-- Semi-transparent Content Card for guaranteed readability -->
    <rect x="60" y="60" width="740" height="280" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Badge Tag -->
    <rect x="95" y="95" width="230" height="32" rx="16" fill="url(#primaryGlow)"/>
    <text x="210" y="116" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">🚀 CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="95" y="180" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Database
    </text>

    <!-- Title Sub-gradient Span -->
    <text x="95" y="225" fill="url(#cyanGlow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700">
      Cloud-Native &amp; Open-Source
    </text>

    <!-- Description Subtitle -->
    <text x="95" y="268" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Distributed SQL • Serverless Postgres • Managed DBaaS • BaaS Platforms
    </text>

    <!-- Bottom Highlight Bar -->
    <rect x="95" y="298" width="670" height="4" rx="2" fill="url(#primaryGlow)"/>
  </g>
</svg>
